<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Test Website For GitHub and Docker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
            background-color: #f4f4f4;
        }

        .container {
            background: white;
            width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h1 {
            color: #2c3e50;
        }

        button {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background: #218838;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Welcome to My Test Website For GitHub and Docker</h1>
    <p>This website is used for Git and Docker testing.</p>

    <button onclick="showMessage()">Click Me</button>

    <p id="message"></p>
</div>

<script>
    function showMessage() {
        document.getElementById("message").innerHTML =
            "Hello HONGY! Git is working successfully.";
    }
</script>

</body>
</html>
